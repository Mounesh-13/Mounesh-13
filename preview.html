<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>I see dead people</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #030503;
      color: #e6edf3;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 40px 16px;
      position: relative;
    }

    /* CRT scanlines effect */
    body::after {
      content: " ";
      display: block;
      position: fixed;
      top: 0; left: 0; bottom: 0; right: 0;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.4) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.05), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.04));
      z-index: 9999;
      background-size: 100% 3px, 6px 100%;
      pointer-events: none;
      opacity: 0.9;
    }

    .container {
      max-width: 680px;
      width: 100%;
      text-align: center;
    }

    .github-box {
      background: #060906;
      border: 1px solid #4a1212;
      border-radius: 12px;
      padding: 32px 24px;
      box-shadow: 0 0 50px rgba(0, 0, 0, 0.95), 0 0 25px rgba(255, 20, 20, 0.2);
    }

    h1 {
      color: #ff2222;
      text-shadow: 0 0 16px rgba(255, 34, 34, 0.7), 0 0 30px rgba(255, 0, 0, 0.4);
      font-size: 28px;
      font-weight: 800;
      letter-spacing: 4px;
      margin-top: 20px;
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
    }

    img {
      max-width: 100%;
      height: auto;
      border-radius: 8px;
      border: 1px solid #4a1212;
      box-shadow: 0 0 40px rgba(255, 0, 0, 0.45), 0 15px 40px rgba(0, 0, 0, 0.9);
      transition: all 0.3s ease;
    }

    img:hover {
      box-shadow: 0 0 60px rgba(255, 0, 0, 0.65), 0 20px 50px rgba(0, 0, 0, 0.95);
      transform: scale(1.01);
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="github-box">
      <div align="center">

<p><img src="./assets/cyberpunk_fullbody.svg" alt="I see dead people" width="100%" style="width: 100%; max-width: 580px; border-radius: 8px; display: block; box-shadow: 0 0 50px rgba(255, 0, 0, 0.4), 0 0 100px rgba(0, 0, 0, 0.9);" /></p>
<p><br/></p>
<h1>❝ <em>I see dead people.</em> ❞</h1>
</div>


    </div>
  </div>

</body>
</html>
