<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" role="img" aria-label="Stickman escape loop">
<title>Stickman tries to escape</title>
<rect x="0" y="0" width="800" height="400" fill="#ffffff"/>
<rect x="4" y="4" width="792" height="392" rx="18" fill="none" stroke="#111" stroke-width="6"/>
<g id="act1">
<line x1="40" y1="330" x2="760" y2="330" stroke="#111" stroke-width="4" stroke-linecap="round"/>
<g id="banana" transform="translate(430,318)">
<path d="M0,0 Q20,12 42,2 Q22,18 0,0 Z" fill="#FFD23F" stroke="#111" stroke-width="3" stroke-linejoin="round"/>
</g>
</g>
<g id="walker">
<animateTransform attributeName="transform" type="translate" values="60 0;420 0;560 0;560 0;60 0" keyTimes="0;0.125;0.33;0.9;1" begin="0s" dur="24s" repeatCount="indefinite"/>
<g transform="translate(0,230)">
<g>
<animateTransform attributeName="transform" type="rotate" values="0;0;-70;-70" keyTimes="0;0.10;0.125;1" begin="0s" dur="24s" repeatCount="indefinite"/>
<circle cx="0" cy="0" r="16" fill="none" stroke="#111" stroke-width="6"/>
<line x1="0" y1="16" x2="0" y2="70" stroke="#111" stroke-width="6" stroke-linecap="round"/>
<line x1="0" y1="34" x2="-20" y2="58" stroke="#111" stroke-width="5" stroke-linecap="round">
<animate attributeName="x2" values="-20;20;-20;-20" keyTimes="0;0.06;0.125;1" begin="0s" dur="24s" repeatCount="indefinite"/>
</line>
<line x1="0" y1="34" x2="20" y2="58" stroke="#111" stroke-width="5" stroke-linecap="round">
<animate attributeName="x2" values="20;-20;20;20" keyTimes="0;0.06;0.125;1" begin="0s" dur="24s" repeatCount="indefinite"/>
</line>
<line x1="0" y1="70" x2="-18" y2="100" stroke="#111" stroke-width="5" stroke-linecap="round">
<animate attributeName="x2" values="-18;18;-18;-18" keyTimes="0;0.06;0.125;1" begin="0s" dur="24s" repeatCount="indefinite"/>
</line>
<line x1="0" y1="70" x2="18" y2="100" stroke="#111" stroke-width="5" stroke-linecap="round">
<animate attributeName="x2" values="18;-18;18;18" keyTimes="0;0.06;0.125;1" begin="0s" dur="24s" repeatCount="indefinite"/>
</line>
</g>
</g>
</g>
<g id="act2" opacity="0">
<animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.16;0.33;0.37" begin="0s" dur="24s" repeatCount="indefinite"/>
<g id="eyes-wide" transform="translate(470,240)" opacity="0">
<animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.16;0.29;0.33" begin="0s" dur="24s" repeatCount="indefinite"/>
<circle cx="-8" cy="0" r="3" fill="#111">
<animate attributeName="r" values="3;3;7;7;3;3" keyTimes="0;0.16;0.20;0.29;0.33;1" begin="0s" dur="24s" repeatCount="indefinite"/>
</circle>
<circle cx="8" cy="0" r="3" fill="#111">
<animate attributeName="r" values="3;3;7;7;3;3" keyTimes="0;0.16;0.20;0.29;0.33;1" begin="0s" dur="24s" repeatCount="indefinite"/>
</circle>
<text x="0" y="-24" text-anchor="middle" font-size="22" font-family="sans-serif" fill="#111">!</text>
</g>
<circle cx="620" cy="180" r="6" fill="none" stroke="#111" stroke-width="3" opacity="0">
<animate attributeName="r" values="6;6;34;34" keyTimes="0;0.25;0.2833;1" begin="0s" dur="24s" repeatCount="indefinite"/>
<animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;0.25;0.26;0.2833;1" begin="0s" dur="24s" repeatCount="indefinite"/>
</circle>
<circle id="knock-ripple-1" cx="620" cy="180" r="6" fill="none" stroke="#111" stroke-width="3" opacity="0">
<animate attributeName="r" values="6;6;34;34" keyTimes="0;0.25;0.2833;1" begin="0s" dur="24s" repeatCount="indefinite"/>
<animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;0.25;0.26;0.2833;1" begin="0s" dur="24s" repeatCount="indefinite"/>
</circle>
<circle cx="620" cy="180" r="6" fill="none" stroke="#111" stroke-width="3" opacity="0">
<animate attributeName="r" values="6;6;34;34" keyTimes="0;0.275;0.3083;1" begin="0s" dur="24s" repeatCount="indefinite"/>
<animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;0.275;0.285;0.3083;1" begin="0s" dur="24s" repeatCount="indefinite"/>
</circle>
<circle id="knock-ripple-2" cx="620" cy="180" r="6" fill="none" stroke="#111" stroke-width="3" opacity="0">
<animate attributeName="r" values="6;6;34;34" keyTimes="0;0.275;0.3083;1" begin="0s" dur="24s" repeatCount="indefinite"/>
<animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;0.275;0.285;0.3083;1" begin="0s" dur="24s" repeatCount="indefinite"/>
</circle>
<text x="620" y="120" text-anchor="middle" font-size="26" font-family="sans-serif" fill="#111" opacity="0">BONK!
<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.25;0.26;0.30;0.333;1" begin="0s" dur="24s" repeatCount="indefinite"/>
</text>
</g>
<g id="act3" opacity="0">
<animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.33;0.54;0.58" begin="0s" dur="24s" repeatCount="indefinite"/>
<g id="mallet" transform="translate(560,250)">
<g>
<animateTransform attributeName="transform" type="rotate" values="-30;-30;45;-30;-30" keyTimes="0;0.333;0.375;0.4167;1" begin="0s" dur="24s" repeatCount="indefinite"/>
<rect x="-14" y="-70" width="28" height="52" rx="6" fill="#E63946" stroke="#111" stroke-width="4"/>
<rect x="-6" y="-18" width="12" height="58" fill="#8B5E34" stroke="#111" stroke-width="4"/>
</g>
</g>
<polyline id="crack" points="600,330 580,260 610,210 590,150 620,100" fill="none" stroke="#111" stroke-width="4" stroke-linecap="round" stroke-dasharray="400" stroke-dashoffset="400">
<animate attributeName="stroke-dashoffset" values="400;400;0;0" keyTimes="0;0.4167;0.4417;1" begin="0s" dur="24s" repeatCount="indefinite"/>
</polyline>
<text x="400" y="60" text-anchor="middle" font-size="34" font-family="sans-serif" font-weight="bold" fill="#E63946" opacity="0">CRACK!
<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.4167;0.43;0.45;0.4667;1" begin="0s" dur="24s" repeatCount="indefinite"/>
</text>
</g>
<g id="act4" opacity="0">
<animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.58;0.79;0.83" begin="0s" dur="24s" repeatCount="indefinite"/>
<g id="leak">
<rect id="leak-drop" x="200" y="20" width="14" height="22" rx="7" fill="#4CC9F0" stroke="#111" stroke-width="3">
<animate attributeName="y" values="20;20;300;300" keyTimes="0;0.5833;0.625;1" begin="0s" dur="24s" repeatCount="indefinite"/>
<animate attributeName="opacity" values="1;1;1;0;0" keyTimes="0;0.5833;0.60;0.625;1" begin="0s" dur="24s" repeatCount="indefinite"/>
</rect>
<rect id="leak-drop-2" x="260" y="20" width="10" height="16" rx="5" fill="#4CC9F0" stroke="#111" stroke-width="3">
<animate attributeName="y" values="20;20;300;300" keyTimes="0;0.625;0.6667;1" begin="0s" dur="24s" repeatCount="indefinite"/>
<animate attributeName="opacity" values="1;1;1;0;0" keyTimes="0;0.625;0.65;0.6667;1" begin="0s" dur="24s" repeatCount="indefinite"/>
</rect>
</g>
<g id="big-red-button" transform="translate(680,300)">
<rect x="-52" y="-18" width="104" height="36" rx="8" fill="#ffffff" stroke="#111" stroke-width="4"/>
<circle cx="0" cy="0" r="12" fill="#E63946" stroke="#111" stroke-width="4">
<animate attributeName="r" values="12;12;9;12;12" keyTimes="0;0.7083;0.7208;0.7333;1" begin="0s" dur="24s" repeatCount="indefinite"/>
</circle>
<text x="0" y="-26" text-anchor="middle" font-size="13" font-family="sans-serif" fill="#111">DO NOT PRESS</text>
</g>
</g>
<g id="act5">
<text x="400" y="200" text-anchor="middle" font-size="30" font-family="sans-serif" font-weight="bold" fill="#111" opacity="0">PHEW!<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.83;0.85;0.93;0.97;1" begin="0s" dur="24s" repeatCount="indefinite"/></text>
</g>
</svg>
