<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" role="img" aria-label="Stickman dancing on loop">
<title>Stickman dancing on loop</title>
<rect x="0" y="0" width="800" height="400" fill="#0d1117"/>
<rect x="4" y="4" width="792" height="392" rx="18" fill="none" stroke="#fff" stroke-width="6"/>
<line x1="40" y1="330" x2="760" y2="330" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
<g id="curtain-left"><path d="M0,0 H92 C82,110 108,230 90,340 H0 Z" fill="#C1121F"/><path d="M24,0 C20,110 30,230 24,340 L36,340 C38,230 32,110 36,0 Z" fill="#780000"/><path d="M56,0 C52,110 60,230 55,340 L65,340 C67,230 62,110 65,0 Z" fill="#780000"/><path d="M92,0 C82,110 108,230 90,340" fill="none" stroke="#FFD23F" stroke-width="3"/></g>
<g id="curtain-right"><path d="M800,0 H708 C718,110 692,230 710,340 H800 Z" fill="#C1121F"/><path d="M776,0 C780,110 770,230 776,340 L764,340 C762,230 768,110 764,0 Z" fill="#780000"/><path d="M744,0 C748,110 740,230 745,340 L735,340 C733,230 738,110 735,0 Z" fill="#780000"/><path d="M708,0 C718,110 692,230 710,340" fill="none" stroke="#FFD23F" stroke-width="3"/></g>
<g id="curtain-top"><path d="M0,0 H800 V28 Q667,58 534,28 Q400,58 267,28 Q134,58 0,28 Z" fill="#C1121F"/><path d="M0,28 Q134,58 267,28 Q400,58 534,28 Q667,58 800,28" fill="none" stroke="#FFD23F" stroke-width="3"/></g>
<g id="dancer" transform="translate(400,210)">
<g>
<animateTransform attributeName="transform" type="translate" values="0 0;0 -14;0 0;0 -10;0 0" keyTimes="0;0.25;0.5;0.75;1" begin="0s" dur="8s" repeatCount="indefinite"/>
<g>
<animateTransform attributeName="transform" type="rotate" values="-8;8;-8" keyTimes="0;0.5;1" begin="0s" dur="8s" repeatCount="indefinite"/>
<circle cx="0" cy="0" r="16" fill="none" stroke="#fff" stroke-width="6">
<animate attributeName="cy" values="0;-6;0;-4;0" keyTimes="0;0.25;0.5;0.75;1" begin="0s" dur="8s" repeatCount="indefinite"/>
</circle>
<line x1="0" y1="16" x2="0" y2="70" stroke="#fff" stroke-width="6" stroke-linecap="round"/>
<line x1="0" y1="34" x2="-28" y2="58" stroke="#fff" stroke-width="5" stroke-linecap="round">
<animate attributeName="x2" values="-28;28;-28" keyTimes="0;0.5;1" begin="0s" dur="8s" repeatCount="indefinite"/>
</line>
<line x1="0" y1="34" x2="28" y2="58" stroke="#fff" stroke-width="5" stroke-linecap="round">
<animate attributeName="x2" values="28;-28;28" keyTimes="0;0.5;1" begin="0s" dur="8s" repeatCount="indefinite"/>
</line>
<line x1="0" y1="70" x2="-26" y2="100" stroke="#fff" stroke-width="5" stroke-linecap="round">
<animate attributeName="x2" values="-26;14;-26" keyTimes="0;0.5;1" begin="0s" dur="8s" repeatCount="indefinite"/>
</line>
<line x1="0" y1="70" x2="26" y2="100" stroke="#fff" stroke-width="5" stroke-linecap="round">
<animate attributeName="x2" values="26;-14;26" keyTimes="0;0.5;1" begin="0s" dur="8s" repeatCount="indefinite"/>
</line>
</g>
</g>
</g>
<g id="banana" transform="translate(520,318)">
<g>
<animateTransform attributeName="transform" type="translate" values="0 0;0 -8;0 0;0 -6;0 0" keyTimes="0;0.25;0.5;0.75;1" begin="0s" dur="8s" repeatCount="indefinite"/>
<g>
<animateTransform attributeName="transform" type="rotate" values="-10;10;-10" keyTimes="0;0.5;1" begin="0s" dur="8s" repeatCount="indefinite"/>
<path d="M0,0 Q20,12 42,2 Q22,18 0,0 Z" fill="#FFD23F" stroke="#fff" stroke-width="3" stroke-linejoin="round"/>
</g>
</g>
</g>
<text x="310" y="180" text-anchor="middle" font-size="28" font-family="sans-serif" fill="#fff">♪<animate attributeName="y" values="180;140;100;140;180" keyTimes="0;0.25;0.5;0.75;1" begin="0s" dur="8s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0;1;0" keyTimes="0;0.25;0.5;0.75;1" begin="0s" dur="8s" repeatCount="indefinite"/></text>
<text x="470" y="160" text-anchor="middle" font-size="24" font-family="sans-serif" fill="#fff">♪<animate attributeName="y" values="160;120;80;120;160" keyTimes="0;0.25;0.5;0.75;1" begin="0s" dur="8s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0;1;0" keyTimes="0;0.25;0.5;0.75;1" begin="0s" dur="8s" repeatCount="indefinite"/></text>
<text x="540" y="200" text-anchor="middle" font-size="32" font-family="sans-serif" fill="#fff">♪<animate attributeName="y" values="200;160;120;160;200" keyTimes="0;0.25;0.5;0.75;1" begin="0s" dur="8s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0;1;0" keyTimes="0;0.25;0.5;0.75;1" begin="0s" dur="8s" repeatCount="indefinite"/></text>
</svg>
