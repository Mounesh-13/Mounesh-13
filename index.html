<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>I see dead people // GitHub Profile</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #030603;
      color: #e6edf3;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 40px 16px;
      position: relative;
    }

    /* CRT scanlines effect */
    body::after {
      content: " ";
      display: block;
      position: fixed;
      top: 0; left: 0; bottom: 0; right: 0;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.4) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.05), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.04));
      z-index: 9999;
      background-size: 100% 3px, 6px 100%;
      pointer-events: none;
      opacity: 0.9;
    }

    .container {
      max-width: 640px;
      width: 100%;
      text-align: center;
    }

    .github-box {
      background: #050905;
      border: 1px solid #1a381c;
      border-radius: 12px;
      padding: 28px 20px;
      box-shadow: 0 0 60px rgba(0, 0, 0, 0.98), 0 0 25px rgba(117, 184, 112, 0.15);
    }

    img {
      max-width: 100%;
      height: auto;
      border-radius: 8px;
      border: 1px solid #1a381c;
      box-shadow: 0 0 50px rgba(0, 0, 0, 0.95), 0 0 30px rgba(117, 184, 112, 0.25);
      transition: all 0.3s ease;
    }

    img:hover {
      box-shadow: 0 0 70px rgba(0, 0, 0, 0.98), 0 0 45px rgba(117, 184, 112, 0.4);
      transform: scale(1.01);
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="github-box">
      <div align="center">

<p><img src="./assets/cyberpunk_fullbody.svg" alt="I see dead people" width="100%" style="width: 100%; max-width: 580px; border-radius: 8px; display: block; box-shadow: 0 0 60px rgba(0, 0, 0, 0.95), 0 0 30px rgba(117, 184, 112, 0.25);" /></p>
</div>


    </div>
  </div>

</body>
</html>
